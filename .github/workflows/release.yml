name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and package only (select a v* tag to actually publish)
        type: boolean
        default: true
        required: true

permissions:
  contents: read

# Serialize every release to prevent two versions racing the npm dist-tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node server/ci/release.mjs validate
        env:
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  verify:
    name: Verify release
    needs: source
    uses: ./.github/workflows/ci.yml
  rehearse:
    name: Rehearse artifact publication
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flowly-package
          path: dist/npm
      - run: sha256sum --check SHA256SUMS
        working-directory: dist/npm
      - run: node server/ci/release.mjs rehearse
        env:
          RELEASE_DRY_RUN: 'true'
  publish:
    name: Publish npm and GitHub
    needs: verify
    if: github.repository == 'JasprW/flowly' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flowly-package
          path: dist/npm
      - name: Require an OIDC-capable npm
        run: node -e "const [a,b,c]=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(a<11 || (a===11 && (b<5 || (b===5 && c<1)))) process.exit(1)"
      - name: Publish exact tested package through OIDC
        id: npm
        run: node server/ci/release.mjs publish
      - name: Create or resume GitHub release
        run: node server/ci/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Registry submission reminder
        run: echo 'Paseo registry pins a commit; submit a registry update separately after release.' >> "$GITHUB_STEP_SUMMARY"
