<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Flowly wordmark options</title>
<style>
  :root { --ink:#1E2120; --muted:#6B6A64; --paper:#F7F5F2; --line:#E4DFD8; --dark:#1E2120; --light:#F3F1EC; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 44px 48px; background:var(--paper); color:var(--ink); font:14px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; width:1600px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; max-width:1200px; }
  .row { display:grid; grid-template-columns:230px 1fr 1fr; gap:16px; align-items:stretch; margin-bottom:14px; }
  .meta { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .meta .tag { font-weight:700; font-size:13px; color:#fff; background:var(--ink); border-radius:6px; padding:1px 7px; margin-right:6px; }
  .meta .name { font-weight:650; font-size:15px; }
  .meta p { margin:8px 0 0; color:#3B3A36; font-size:13px; }
  .box { border-radius:14px; padding:22px 26px; display:flex; flex-direction:column; justify-content:center; gap:16px; }
  .box.l { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .box.d { background:var(--dark); color:var(--light); }
  .line { display:flex; align-items:center; gap:28px; }
</style>
</head>
<body>
<h1>Flowly · 字标重做</h1>
<p class="sub">标志用 R1 精修版。字标换成 Inter（SIL Open Font License 1.1，可用于 logo）转成的路径，不依赖字体文件；横排组合里字母高度统一为标志的 55%，Medium 的竖笔宽度和标志线宽几乎一样（4.2 对 4）。W0 是现在的字标，M1 是更规整的单线版。</p>
<div id="rows"></div>
<script>
const svgs = window.__SVGS || {};
const draw = (file, h) => {
  const src = svgs[file];
  if (!src) return `<img src="${file}" height="${h}">`;
  const vb = /viewBox="([^"]+)"/.exec(src)[1].split(/\s+/).map(Number);
  return src.replace("<svg ", `<svg height="${h}" width="${Math.round(h * vb[2] / vb[3])}" `);
};
const rows = [
  ["W0", "现在的字标", "w0-current", "圆头单线、波浪 w、笔画偏粗，偏可爱，不够正式。"],
  ["W1", "Inter Medium · 小写", "w1-inter-medium", "字距收紧一点。竖笔和标志线宽一致，横排时最协调。"],
  ["W2", "Inter SemiBold · 小写", "w2-inter-semibold", "更重更稳，适合小尺寸和深色背景，但比标志的线条重。"],
  ["W3", "Inter Regular · 小写", "w3-inter-regular", "最轻最清爽，大尺寸好看，小尺寸偏弱。"],
  ["W4", "Inter SemiBold · 首字母大写", "w4-inter-semibold-title", "Flowly 首字母大写，像产品名，最正式。"],
  ["W5", "Inter Medium · 首字母大写", "w5-inter-medium-title", "首字母大写，字重和标志一致。"],
  ["M1", "单线 · 几何", "m1-monoline", "保留单线，但用直线的 w 和 y、更细的笔画、更短的升部。"],
];
document.getElementById("rows").innerHTML = rows.map(([tag, name, file, note]) => `
  <div class="row">
    <div class="meta"><span class="tag">${tag}</span><span class="name">${name}</span><p>${note}</p></div>
    <div class="box l"><div class="line">${draw(file + "-lockup.svg", 72)}</div><div class="line">${draw(file + "-lockup.svg", 32)}${draw(file + ".svg", 26)}</div></div>
    <div class="box d"><div class="line">${draw(file + "-lockup.svg", 72)}</div><div class="line">${draw(file + "-lockup.svg", 32)}${draw(file + ".svg", 26)}</div></div>
  </div>`).join("");
</script>
</body>
</html>
