<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Flowly check weight</title>
<style>
  :root { --ink:#1E2120; --muted:#6B6A64; --paper:#F7F5F2; --line:#E4DFD8; --dark:#1E2120; --light:#F3F1EC; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 44px 48px; background:var(--paper); color:var(--ink); font:14px/1.5 -apple-system, "PingFang SC", sans-serif; width:1700px; }
  h1 { font-size:24px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 22px; }
  .cols { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .col { display:flex; flex-direction:column; gap:12px; }
  .tag { font-weight:700; font-size:13px; color:#fff; background:var(--ink); border-radius:6px; padding:1px 7px; margin-right:6px; }
  .name { font-weight:650; font-size:15px; } .note { color:#3B3A36; font-size:12.5px; margin:4px 0 0; }
  .box { border-radius:14px; padding:16px; display:flex; align-items:center; justify-content:center; gap:16px; }
  .l { background:#fff; border:1px solid var(--line); color:var(--ink); } .d { background:var(--dark); color:var(--light); }
  .zoom { padding:0; overflow:hidden; height:260px; }
</style></head><body>
<h1>Flowly · 对勾粗细精调</h1>
<p class="sub">只改对勾：圆圈和小路仍是 4 单位线宽。第一行把对勾圈放大约 13 倍，下面是标志 160 / 64 / 32 px（浅、深底）和横排组合。</p>
<div class="cols" id="cols"></div>
<script>
const svgs = window.__SVGS || {};
const draw = (file, h, vb) => { let s = svgs[file] || ""; if (vb) s = s.replace(/viewBox="[^"]+"/, `viewBox="${vb}"`);
  const v = /viewBox="([^"]+)"/.exec(s)[1].split(/\s+/).map(Number); return s.replace("<svg ", `<svg height="${h}" width="${Math.round(h*v[2]/v[3])}" `); };
const lock = (f, h) => `<span style="display:inline-flex;align-items:center;gap:${h*0.22}px">${draw(f, h)}${draw("flowly-wordmark.svg", h*0.62)}</span>`;
const cols = [
  ["K0", "现在", "k0-current", "对勾和圆圈同为 4 单位，对勾圈看起来最重。"],
  ["K1", "细一档", "k1-thin", "对勾 3 单位、形状不变；和圆圈拉开层次。"],
  ["K2", "细一档 + 稍大", "k2-thin-larger", "对勾 3 单位、放大 12%，留白更均匀，小尺寸更易认。"],
  ["K3", "更细", "k3-finer", "对勾 2.5 单位、放大 15%，最轻，32 px 下开始发虚。"],
];
document.getElementById("cols").innerHTML = cols.map(([t, n, f, note]) => `<div class="col">
  <div><span class="tag">${t}</span><span class="name">${n}</span><p class="note">${note}</p></div>
  <div class="box l zoom">${draw(f + ".svg", 260, "40 4.5 20 20")}</div>
  <div class="box l">${draw(f + ".svg", 160)}</div>
  <div class="box l">${draw(f + ".svg", 64)}${draw(f + ".svg", 32)}</div>
  <div class="box d">${draw(f + ".svg", 64)}${draw(f + ".svg", 32)}</div>
  <div class="box l">${lock(f + ".svg", 48)}</div></div>`).join("");
</script></body></html>
