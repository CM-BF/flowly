<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Flowly logo · H refined</title>
<style>
  :root { --ink:#1E2120; --muted:#6B6A64; --paper:#F7F5F2; --line:#E4DFD8; --dark:#1E2120; --light:#EDEBE6; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 44px 48px; background:var(--paper); color:var(--ink); font:14px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; width:1500px; }
  h1 { font-size:24px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; color:var(--ink); }
  .head { display:flex; align-items:baseline; gap:8px; margin-bottom:12px; }
  .tag { font-weight:700; font-size:13px; color:#fff; background:var(--ink); border-radius:6px; padding:1px 7px; }
  .new { font-size:11px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:0 6px; }
  .name { font-weight:650; font-size:16px; }
  .en { color:var(--muted); font-size:13px; }
  .stage { display:flex; gap:16px; align-items:center; }
  .big { width:120px; height:120px; flex:none; }
  .sizes { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .row { display:flex; align-items:center; gap:12px; }
  .dark { background:var(--dark); color:var(--light); border-radius:10px; padding:9px 11px; }
  .lock { display:flex; align-items:center; gap:8px; }
  p.idea { margin:12px 0 0; color:#3B3A36; font-size:13px; }
  .wm-big { width:260px; height:113px; }
</style>
</head>
<body>
<h1>Flowly · H 原版继续优化</h1>
<p class="sub">保持原版 H 的布局（起点圈 → 进行中 → 对勾，沿一条拐两次弯的小路），只调比例、连接线和对勾；f 只藏在「中间圈往上再向右拐」那一段里。</p>
<div class="grid" id="grid"></div>
<script>
// The render script injects every SVG's source as window.__SVGS so it can be drawn inline in either color;
// opened straight from disk, the page falls back to <img> (dark strokes only).
const svgs = window.__SVGS || {};
const mark = (file, size, cls = "") => {
  const src = svgs[file];
  if (!src) return `<img class="${cls}" src="${file}" width="${size}" height="${size}">`;
  return src.replace("<svg ", `<svg class="${cls}" width="${size}" height="${size}" `);
};
const wordmark = (height) => {
  const src = svgs["f-wordmark.svg"];
  const width = Math.round(height * 1060 / 460);
  if (!src) return `<img src="f-wordmark.svg" height="${height}">`;
  return src.replace("<svg ", `<svg width="${width}" height="${height}" `);
};
const concepts = [
  ["R0", "原版", "Original", "r0-original.svg", false, "v2 里的 H。对勾几乎顶到圆圈，连接线和圆圈之间的空隙不一致，整体偏右下。"],
  ["R1", "精修", "Tidy", "r1-tidy.svg", true, "布局不变：每段线头离圆圈统一 2 个单位，对勾缩到圆圈里留出空隙，整体居中。"],
  ["R2", "连通", "Connected", "r2-connected.svg", true, "连接线直接接上圆圈，三站连成一条不断的路线，更像一条流。"],
  ["R3", "轻节点", "Light nodes", "r3-light.svg", true, "圆圈缩小一点，空隙不变，小路占的比重更大。"],
  ["R4", "连通 + 轻节点", "Connected, light", "r4-connected-light.svg", true, "R2 和 R3 合起来：小一点的圆圈，用不断的线连起来。"],
];
const grid = document.getElementById("grid");
for (const [tag, name, en, file, isNew, idea] of concepts) {
  grid.insertAdjacentHTML("beforeend", `
  <div class="card">
    <div class="head"><span class="tag">${tag}</span><span class="name">${name}</span><span class="en">${en}</span>${isNew ? '<span class="new">新</span>' : ""}</div>
    <div class="stage">
      ${mark(file, 120, "big")}
      <div class="sizes">
        <div class="row">${mark(file, 48)}${mark(file, 32)}${mark(file, 24)}${mark(file, 16)}</div>
        <div class="row dark">${mark(file, 32)}${mark(file, 16)}<span class="lock">${mark(file, 26)}${wordmark(26)}</span></div>
        <div class="row lock">${mark(file, 30)}${wordmark(30)}</div>
      </div>
    </div>
    <p class="idea">${idea}</p>
  </div>`);
}
</script>
</body>
</html>
